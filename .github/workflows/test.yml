name: Run HumanPilot Workflow

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  release:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Mamba environment
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
        with:
          cache-downloads: true
          cache-environment: true
          environment-file: environment.yml
          environment-name: loopy

      - name: Install ncurses if Windows
        if: matrix.os == 'windows-latest'
        run: |
          pip install windows-curses
        shell: bash -el {0}

      - name: Cache data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: scripts/temp
          key: ${{ hashFiles('scripts/process_humanpilot.py') }}

      - name: Test
        run: |
          micromamba install -c conda-forge pytest pytest-cov
          pytest
        shell: bash -el {0}

      - name: Run HumanPilot data prep
        run: |
          cd scripts
          python process_humanpilot.py
        shell: bash -el {0}
